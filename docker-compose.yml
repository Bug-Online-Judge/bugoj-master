version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bugoj-database
    environment:
      POSTGRES_USER: bugoj_user
      POSTGRES_PASSWORD: bugoj_secure_pass
      POSTGRES_DB: bugoj
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: bugoj-redis
    command: [ "redis-server", "--requirepass", "bugoj_secure_pass" ]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
